syntax = "proto3";

package processor;

option go_package = "github.com/sagar/streamforge/proto";

message CheckpointBarrier {
  int64 checkpoint_id = 1;
  int64 timestamp = 2;
}

message SpeculativeTaskRequest {
  int32 partition_id = 1;
  int64 checkpoint_id = 2;
  int64 target_window_id = 3;
}

message ArbitratorSubmission {
  int64 window_id = 1;
  int32 partition_id = 2;
  bytes result_payload = 3;
  string worker_id = 4; // distinguishes original vs speculative
}

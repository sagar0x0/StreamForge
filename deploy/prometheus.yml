global:
  scrape_interval: 1s

scrape_configs:
  - job_name: 'broker'
    static_configs:
      - targets: ['broker-1:2112', 'broker-2:2112', 'broker-3:2112']
  - job_name: 'processor'
    static_configs:
      - targets: ['processor-primary:2113', 'processor-spare:2113']
  - job_name: 'loadgen'
    static_configs:
      - targets: ['loadgen:2114']

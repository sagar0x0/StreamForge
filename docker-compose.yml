version: '3.8'

services:
  broker-1:
    build:
      context: .
      target: broker
    ports:
      - "9092:9092"
    environment:
      - NODE_ID=1
      - PEERS=broker-1:9093,broker-2:9093,broker-3:9093

  broker-2:
    build:
      context: .
      target: broker
    ports:
      - "9093:9092"
    environment:
      - NODE_ID=2
      - PEERS=broker-1:9093,broker-2:9093,broker-3:9093

  broker-3:
    build:
      context: .
      target: broker
    ports:
      - "9094:9092"
    environment:
      - NODE_ID=3
      - PEERS=broker-1:9093,broker-2:9093,broker-3:9093

  processor-primary:
    build:
      context: .
      target: processor
    environment:
      - BROKERS=broker-1:9092,broker-2:9092,broker-3:9092
      - GROUP_ID=stream-engine
      - ENABLE_SPECULATION=true

  processor-spare:
    build:
      context: .
      target: processor
    environment:
      - BROKERS=broker-1:9092,broker-2:9092,broker-3:9092
      - GROUP_ID=stream-engine

  loadgen:
    build:
      context: .
      target: loadgen
    environment:
      - BROKERS=broker-1:9092,broker-2:9092,broker-3:9092
      - MODE=skewed

  prometheus:
    image: prom/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
